[project]
name = "pdf-qa-chatbot"
version = "0.1.0"
description = "RAG-based PDF Q&A chatbot with page-cited answers."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
